# Local development services. Start with: docker compose up -d
# The password is a development default for a local-only database; never reuse it elsewhere.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: historyverse
      POSTGRES_PASSWORD: historyverse_dev
      POSTGRES_DB: historyverse
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U historyverse"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Needed from Milestone 8 (background jobs).
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  postgres-data:
