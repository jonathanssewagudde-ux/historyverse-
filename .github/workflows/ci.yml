name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: historyverse
          POSTGRES_PASSWORD: historyverse_dev
          POSTGRES_DB: historyverse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U historyverse" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://historyverse:historyverse_dev@127.0.0.1:5432/historyverse_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install eSpeak NG, FFmpeg and fonts (free local narration and rendering used by tests)
        run: sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg fonts-dejavu-core
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
